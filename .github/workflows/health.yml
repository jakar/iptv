name: Health Scan

# Probes streams in parallel shards, merges the results back into a single
# health database and pushes it to the `state` branch. The next Sync run picks
# it up and folds the scores into the API.

on:
  schedule:
    # 03:00 and 15:00 UTC.
    - cron: '0 3,15 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max streams per shard (0 = no limit)'
        type: string
        default: '0'

permissions:
  contents: write

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  scan:
    name: Probe shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # Fixed at six shards: a dynamic count would need a separate planning
      # job, and --shard-count below must match this list exactly.
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/setup-ffprobe

      - name: Restore health database
        continue-on-error: true
        run: |
          mkdir -p .data
          git fetch origin state:state --depth=1 2>/dev/null || exit 0
          git show state:health.json > .data/health.json 2>/dev/null || true

      - name: Aggregate (needed for the stream list)
        run: npm run cli -- aggregate

      - name: Probe streams
        run: |
          LIMIT="${{ inputs.limit || '0' }}"
          ARGS="--shard-count 6 --shard-index ${{ matrix.shard }} --min-age 300"
          if [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          npm run cli -- health $ARGS

      - uses: actions/upload-artifact@v7
        with:
          name: health-shard-${{ matrix.shard }}
          path: .data/health.json
          retention-days: 1

  merge:
    name: Merge shards
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          path: shards
          pattern: health-shard-*

      - name: Check downloaded shards
        id: shards
        run: |
          COUNT=$(find shards -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Downloaded $COUNT shard file(s)"
          if [ "$COUNT" = "0" ]; then
            if [ "${{ needs.scan.result }}" = "success" ]; then
              echo "::error::Scan jobs succeeded but produced no shard artifacts"
              exit 1
            fi
            echo "⚠️ No health shards were produced because every scan job failed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Merge health databases
        if: steps.shards.outputs.count != '0'
        run: node scripts/merge-health.mjs shards .data/health.json

      - name: Push to state branch
        if: steps.shards.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          test -f .data/health.json || exit 1
          chmod +x scripts/publish-state.sh
          ./scripts/publish-state.sh "health: $(date -u +%FT%TZ)" .data/health.json:health.json

      - name: Report
        if: steps.shards.outputs.count != '0'
        run: |
          node -e "
            const records = require('./.data/health.json');
            const by = (s) => records.filter(r => r.status === s).length;
            const rows = ['online','offline','timeout','blocked','error','unknown']
              .map(s => '| ' + s + ' | ' + by(s).toLocaleString() + ' |');
            const avg = (records.reduce((a, r) => a + r.score, 0) / (records.length || 1)).toFixed(1);
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              '## Health scan',
              '',
              'Total streams tracked: **' + records.length.toLocaleString() + '**  ',
              'Average score: **' + avg + '/100**',
              '',
              '| Status | Count |',
              '| --- | --- |',
              ...rows,
            ].join('\n') + '\n');
          "
